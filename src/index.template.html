  <link id="theme-favicon" rel="icon" type="image/png" href="assets/logo-light-icon.png" />
  <script>
    (() => {
      const root = document.documentElement;
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      const saved = localStorage.getItem('shridey-theme');
      const theme = saved === 'dark' || saved === 'light'
        ? saved
        : (prefersDark.matches ? 'dark' : 'light');
      root.dataset.theme = theme;

      // The browser-tab favicon follows the operating-system theme only.
      // The in-app theme toggle must not change it.
      const favicon = document.getElementById('theme-favicon');
      const updateSystemFavicon = () => {
        if (favicon) {
          favicon.setAttribute('href', prefersDark.matches
            ? 'assets/logo-dark-icon.png'
            : 'assets/logo-light-icon.png');
        }
      };
      updateSystemFavicon();
      prefersDark.addEventListener('change', updateSystemFavicon);
    })();
  </script>
